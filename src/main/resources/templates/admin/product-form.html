<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{base}">

<head>
    <title>Admin - Edit Product</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="container" style="padding-top: 120px; padding-bottom: 60px;">
            <div class="section-title">
                <h2 th:text="${product.id == null ? 'Add New Product' : 'Edit Product'}">Product Form</h2>
            </div>

            <div class="admin-glass-card" style="max-width: 600px; margin: 0 auto; padding: 40px;">
                <form th:action="@{/admin/products/save}" th:object="${product}" method="post"
                    enctype="multipart/form-data">
                    <input type="hidden" th:field="*{id}" />

                    <div class="form-group" style="margin-bottom: 20px;">
                        <label style="display: block; margin-bottom: 10px; color: var(--text-secondary);">Product
                            Name</label>
                        <input type="text" th:field="*{name}" class="glass-input" required
                            style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: white;">
                    </div>

                    <div class="form-group" style="margin-bottom: 20px;">
                        <label
                            style="display: block; margin-bottom: 10px; color: var(--text-secondary);">Description</label>
                        <textarea th:field="*{description}" class="glass-input" rows="4"
                            style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: white;"></textarea>
                    </div>

                    <div class="form-group" style="margin-bottom: 20px;">
                        <label style="display: block; margin-bottom: 10px; color: var(--text-secondary);">Small
                            Description</label>
                        <input type="text" th:field="*{smallDescription}" class="glass-input"
                            style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: white;">
                    </div>

                    <div class="form-group" style="margin-bottom: 20px;">
                        <label style="display: block; margin-bottom: 10px; color: var(--text-secondary);">Price
                            (₹)</label>
                        <input type="number" th:field="*{price}" class="glass-input" required
                            style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: white;">
                    </div>

                    <div class="form-group" style="margin-bottom: 20px;">
                        <label style="display: block; margin-bottom: 10px; color: var(--text-secondary);">Original Price
                            (Optional)</label>
                        <input type="number" th:field="*{originalPrice}" class="glass-input"
                            style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: white;">
                    </div>

                    <div class="form-group" style="margin-bottom: 20px;">
                        <label style="display: block; margin-bottom: 10px; color: var(--text-secondary);">Rating
                            (0-5)</label>
                        <input type="number" th:field="*{rating}" class="glass-input" step="0.1" min="0" max="5"
                            value="0"
                            style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: white;">
                    </div>

                    <div class="form-group" style="margin-bottom: 20px;">
                        <label style="display: block; margin-bottom: 10px; color: var(--text-secondary);">Badge
                            (Optional)</label>
                        <input type="text" th:field="*{badge}" class="glass-input"
                            placeholder="e.g., sale, new, popular"
                            style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: white;">
                    </div>

                    <div class="form-group" style="margin-bottom: 20px;">
                        <label style="display: block; margin-bottom: 10px; color: var(--text-secondary);">Image URL
                            (Optional)</label>
                        <input type="text" th:field="*{imageUrl}" class="glass-input"
                            style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: white;">
                    </div>

                    <div class="form-group" style="margin-bottom: 20px;">
                        <label style="display: block; margin-bottom: 10px; color: var(--text-secondary);">Upload Image
                            (Overrides URL)</label>
                        <input type="file" name="imageFile" class="glass-input" accept="image/*"
                            style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: white;">
                    </div>

                    <div class="form-group" style="margin-bottom: 20px;">
                        <select th:field="*{category}" class="glass-input"
                            style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: #0f172a; color: white;">
                            <option th:each="cat : ${categories}" th:value="${cat.name()}"
                                th:text="${cat.name().replace('_', ' ')}">Category Name</option>
                        </select>
                    </div>

                    <div class="form-buttons" style="display: flex; gap: 15px; margin-top: 30px;">
                        <button type="submit" class="btn-primary" style="flex: 1;">Save Product</button>
                        <a th:href="@{/admin/products}" class="btn-glass"
                            style="flex: 1; text-align: center;">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
