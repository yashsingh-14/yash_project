<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{base}">

<head>
    <title>Admin - Products</title>
</head>

<body>
    <section layout:fragment="content">
        <div class="container-fluid my-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2><i class="fas fa-cog"></i> Admin Panel - Products</h2>
                <div>
                    <a href="/admin/users" class="btn btn-outline-primary btn-sm">Users</a>
                    <a href="/admin/orders" class="btn btn-outline-primary btn-sm">Orders</a>
                    <a href="/admin/addresses" class="btn btn-outline-primary btn-sm">Addresses</a>
                    <a href="/admin/carts" class="btn btn-outline-primary btn-sm">Carts</a>
                </div>
            </div>

            <div class="row">
                <div class="col-md-4">
                    <div class="card">
                        <div class="card-header bg-primary text-white">
                            <h5 class="mb-0"><i class="fas fa-plus"></i> Add New Product</h5>
                        </div>
                        <div class="card-body">
                            <form th:action="@{/admin/products/add}" method="post">
                                <div class="mb-3">
                                    <label class="form-label">Product Name</label>
                                    <input type="text" name="name" class="form-control" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Category</label>
                                    <input type="text" name="category" class="form-control"
                                        placeholder="e.g., T-Shirt, Jeans" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Price (₹)</label>
                                    <input type="number" name="price" class="form-control" step="0.01" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Description</label>
                                    <textarea name="description" class="form-control" rows="3" required></textarea>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Image URL</label>
                                    <input type="url" name="imageUrl" class="form-control" placeholder="https://..."
                                        required>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">
                                    <i class="fas fa-save"></i> Add Product
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="col-md-8">
                    <div class="card">
                        <div class="card-header bg-light">
                            <h5 class="mb-0"><i class="fas fa-list"></i> All Products</h5>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-striped">
                                    <thead>
                                        <tr>
                                            <th>ID</th>
                                            <th>Image</th>
                                            <th>Name</th>
                                            <th>Category</th>
                                            <th>Price</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="product : ${products}">
                                            <td th:text="${product.id}">1</td>
                                            <td>
                                                <img th:src="${product.imageUrl}" alt="Product"
                                                    style="width: 50px; height: 50px; object-fit: cover;">
                                            </td>
                                            <td th:text="${product.name}">Product Name</td>
                                            <td th:text="${product.category}">Category</td>
                                            <td>₹<span th:text="${product.price}">999</span></td>
                                            <td>
                                                <a th:href="@{/admin/products/delete/{id}(id=${product.id})}"
                                                    class="btn btn-danger btn-sm"
                                                    onclick="return confirm('Delete this product?')">
                                                    <i class="fas fa-trash"></i>
                                                </a>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
