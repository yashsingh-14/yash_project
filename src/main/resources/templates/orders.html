<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{base}">

<head>
    <title>My Orders</title>
</head>

<body>
    <section layout:fragment="content">
        <div class="container my-5">
            <h2 class="mb-4"><i class="fas fa-box"></i> My Orders</h2>

            <div th:if="${orders.empty}" class="text-center py-5">
                <i class="fas fa-box-open fa-4x text-muted mb-3"></i>
                <h3>No Orders Yet</h3>
                <p class="text-muted">Start shopping to see your orders here!</p>
                <a href="/" class="btn btn-primary">
                    <i class="fas fa-shopping-bag"></i> Start Shopping
                </a>
            </div>

            <div th:unless="${orders.empty}">
                <div class="card mb-3" th:each="order : ${orders}">
                    <div class="card-body">
                        <div class="row align-items-center">
                            <div class="col-md-2">
                                <img th:src="${order.product.imageUrl}" class="img-fluid rounded" alt="Product">
                            </div>
                            <div class="col-md-4">
                                <h5 th:text="${order.product.name}">Product Name</h5>
                                <p class="text-muted mb-1">Quantity: <span th:text="${order.quantity}">1</span></p>
                                <p class="text-muted mb-1">Order Date: <span
                                        th:text="${#temporals.format(order.orderAt, 'dd MMM yyyy')}">Date</span></p>

                                <!-- Payment Method Badge -->
                                <p class="mb-1">
                                    <span class="badge"
                                        th:classappend="${order.paymentMethod == 'COD' ? 'bg-success' : 'bg-info'}"
                                        th:if="${order.paymentMethod != null}">
                                        <i class="fas"
                                            th:classappend="${order.paymentMethod == 'COD' ? 'fa-money-bill-wave' : 'fa-credit-card'}"></i>
                                        <span
                                            th:text="${order.paymentMethod == 'COD' ? 'Cash on Delivery' : 
                                                        (order.paymentMethod == 'UPI' ? 'UPI Payment' : 
                                                        (order.paymentMethod == 'CARD' ? 'Card Payment' : 
                                                        (order.paymentMethod == 'NETBANKING' ? 'Net Banking' : order.paymentMethod)))}">
                                            Payment Method
                                        </span>
                                    </span>
                                </p>

                                <!-- Order Status Badge -->
                                <p class="mb-0">
                                    <span class="badge"
                                        th:classappend="${order.status.name() == 'PENDING' ? 'bg-warning text-dark' : 
                                                        (order.status.name() == 'CONFIRMED' ? 'bg-info' : 
                                                        (order.status.name() == 'SHIPPED' ? 'bg-primary' : 
                                                        (order.status.name() == 'DELIVERED' ? 'bg-success' : 'bg-danger')))}"
                                        th:text="${order.status}">Status</span>
                                </p>
                            </div>
                            <div class="col-md-3">
                                <h6>Delivery Address:</h6>
                                <p class="mb-0 small">
                                    <span th:text="${order.address.name}">Name</span><br>
                                    <span th:text="${order.address.area}">Area</span><br>
                                    <span th:text="${order.address.city}">City</span>, <span
                                        th:text="${order.address.state}">State</span><br>
                                    <span th:text="${order.address.pincode}">Pincode</span>
                                </p>
                            </div>
                            <div class="col-md-3 text-end">
                                <h4 class="text-primary mb-3">₹<span
                                        th:text="${order.product.price * order.quantity}">999</span></h4>

                                <!-- Cancel Order Button (only for PENDING orders) -->
                                <div th:if="${order.status.name() == 'PENDING'}">
                                    <form th:action="@{/orders/cancel/{id}(id=${order.id})}" method="post"
                                        style="display: inline;">
                                        <button type="submit" class="btn btn-danger btn-sm"
                                            onclick="return confirm('Are you sure you want to cancel this order?')">
                                            <i class="fas fa-times-circle"></i> Cancel Order
                                        </button>
                                    </form>
                                </div>

                                <!-- Delivered Badge -->
                                <div th:if="${order.status.name() == 'DELIVERED'}">
                                    <span class="badge bg-success">
                                        <i class="fas fa-check-circle"></i> Delivered
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
