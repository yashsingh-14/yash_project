<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{base}">

<head>
    <title>Home</title>
</head>

<body>
    <section layout:fragment="content">
        <!-- Hero Section -->
        <div class="bg-light py-5">
            <div class="container text-center">
                <h1 class="display-4 fw-bold">Welcome to Doxine</h1>
                <p class="lead">Premium Clothing for Every Occasion</p>
            </div>
        </div>

        <!-- Products Section -->
        <div class="container my-5">
            <h2 class="mb-4">Our Collection</h2>
            <div class="row g-4">
                <div class="col-md-3" th:each="product : ${products}">
                    <div class="card h-100 shadow-sm">
                        <img th:src="${product.imageUrl}" class="card-img-top" alt="Product Image"
                            style="height: 250px; object-fit: cover;">
                        <div class="card-body">
                            <h5 class="card-title" th:text="${product.name}">Product Name</h5>
                            <p class="card-text text-muted" th:text="${product.category}">Category</p>
                            <h4 class="text-primary">₹<span th:text="${product.price}">999</span></h4>
                            <div class="d-grid gap-2">
                                <a th:href="@{/product/{id}(id=${product.id})}"
                                    class="btn btn-outline-secondary btn-sm">
                                    <i class="fas fa-eye"></i> View Details
                                </a>
                                <a th:href="@{/cart/add/{id}(id=${product.id})}" class="btn btn-primary btn-sm"
                                    sec:authorize="isAuthenticated()">
                                    <i class="fas fa-cart-plus"></i> Add to Cart
                                </a>
                                <a href="/login" class="btn btn-primary btn-sm" sec:authorize="!isAuthenticated()">
                                    <i class="fas fa-sign-in-alt"></i> Login to Buy
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div th:if="${products.empty}" class="text-center py-5">
                <i class="fas fa-box-open fa-4x text-muted mb-3"></i>
                <h3>No Products Available</h3>
                <p class="text-muted">Check back later for new arrivals!</p>
            </div>
        </div>
    </section>
</body>

</html>
