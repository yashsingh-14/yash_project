<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{base}">

<head>
    <title>Checkout</title>
</head>

<body>
    <section layout:fragment="content">
        <div class="container my-5">
            <h2 class="mb-4"><i class="fas fa-credit-card"></i> Checkout</h2>

            <div class="row">
                <div class="col-md-8">
                    <div class="card mb-4">
                        <div class="card-header bg-light">
                            <h5 class="mb-0"><i class="fas fa-map-marker-alt"></i> Delivery Address</h5>
                        </div>
                        <div class="card-body">
                            <div th:if="${addresses.empty}" class="text-center py-3">
                                <p class="text-muted">No addresses found. Please add an address first.</p>
                                <a href="/address" class="btn btn-primary">
                                    <i class="fas fa-plus"></i> Add Address
                                </a>
                            </div>

                            <div th:unless="${addresses.empty}">
                                <div class="form-check mb-3" th:each="address, iterStat : ${addresses}">
                                    <input class="form-check-input" type="radio" name="addressId"
                                        th:id="'address' + ${address.id}" th:value="${address.id}"
                                        th:checked="${iterStat.first}" required>
                                    <label class="form-check-label" th:for="'address' + ${address.id}">
                                        <strong th:text="${address.name}">Name</strong><br>
                                        <span th:text="${address.area}">Area</span>,
                                        <span th:text="${address.city}">City</span>,
                                        <span th:text="${address.state}">State</span> -
                                        <span th:text="${address.pincode}">Pincode</span>
                                    </label>
                                </div>
                                <a href="/address" class="btn btn-outline-secondary btn-sm">
                                    <i class="fas fa-plus"></i> Add New Address
                                </a>
                            </div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-header bg-light">
                            <h5 class="mb-0"><i class="fas fa-shopping-cart"></i> Order Items</h5>
                        </div>
                        <div class="card-body">
                            <div class="mb-3" th:each="item : ${cartItems}">
                                <div class="d-flex align-items-center">
                                    <img th:src="${item.product.imageUrl}" class="rounded me-3"
                                        style="width: 60px; height: 60px; object-fit: cover;" alt="Product">
                                    <div class="flex-grow-1">
                                        <h6 class="mb-0" th:text="${item.product.name}">Product Name</h6>
                                        <small class="text-muted">Qty: <span th:text="${item.quantity}">1</span></small>
                                    </div>
                                    <h6 class="mb-0 text-primary">₹<span
                                            th:text="${item.product.price * item.quantity}">999</span></h6>
                                </div>
                                <hr th:unless="${itemStat.last}">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Order Summary</h5>
                            <hr>
                            <div class="d-flex justify-content-between mb-2">
                                <span>Subtotal:</span>
                                <span>₹<span th:text="${total}">0</span></span>
                            </div>
                            <div class="d-flex justify-content-between mb-2">
                                <span>Shipping:</span>
                                <span class="text-success">FREE</span>
                            </div>
                            <hr>
                            <div class="d-flex justify-content-between mb-3">
                                <strong>Total:</strong>
                                <strong class="text-primary">₹<span th:text="${total}">0</span></strong>
                            </div>
                            <form th:action="@{/payment}" method="get" id="checkoutForm">
                                <input type="hidden" name="addressId" id="selectedAddressId">
                                <button type="submit" class="btn btn-primary w-100">
                                    <i class="fas fa-arrow-right"></i> Proceed to Payment
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script>
            document.getElementById('checkoutForm').addEventListener('submit', function (e) {
                const selected = document.querySelector('input[name="addressId"]:checked');
                if (!selected) {
                    e.preventDefault();
                    alert('Please select a delivery address');
                    return false;
                }
                // Set the hidden input value
                document.getElementById('selectedAddressId').value = selected.value;
            });
        </script>
    </section>
</body>

</html>
