<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{base}">

<head>
    <title>My Addresses</title>
</head>

<body>
    <section layout:fragment="content">
        <div class="container my-5">
            <h2 class="mb-4"><i class="fas fa-map-marker-alt"></i> My Addresses</h2>

            <div class="row">
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header bg-light">
                            <h5 class="mb-0"><i class="fas fa-plus"></i> Add New Address</h5>
                        </div>
                        <div class="card-body">
                            <form th:action="@{/address/add}" method="post">
                                <div class="mb-3">
                                    <label class="form-label">Full Name</label>
                                    <input type="text" name="name" class="form-control" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Area/Street</label>
                                    <input type="text" name="area" class="form-control" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">City</label>
                                    <input type="text" name="city" class="form-control" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">State</label>
                                    <select name="state" class="form-select" required>
                                        <option value="">Select State</option>
                                        <option value="MAHARASHTRA">Maharashtra</option>
                                        <option value="DELHI">Delhi</option>
                                        <option value="KARNATAKA">Karnataka</option>
                                        <option value="TAMIL_NADU">Tamil Nadu</option>
                                        <option value="UTTAR_PRADESH">Uttar Pradesh</option>
                                        <option value="GUJARAT">Gujarat</option>
                                        <option value="RAJASTHAN">Rajasthan</option>
                                        <option value="WEST_BENGAL">West Bengal</option>
                                        <option value="MADHYA_PRADESH">Madhya Pradesh</option>
                                        <option value="TELANGANA">Telangana</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Pincode</label>
                                    <input type="number" name="pincode" class="form-control" required>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">
                                    <i class="fas fa-save"></i> Save Address
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header bg-light">
                            <h5 class="mb-0"><i class="fas fa-list"></i> Saved Addresses</h5>
                        </div>
                        <div class="card-body">
                            <div th:if="${addresses.empty}" class="text-center py-3">
                                <i class="fas fa-map-marker-alt fa-3x text-muted mb-3"></i>
                                <p class="text-muted">No addresses saved yet.</p>
                            </div>

                            <div th:unless="${addresses.empty}">
                                <div class="card mb-3" th:each="address : ${addresses}">
                                    <div class="card-body">
                                        <h6 th:text="${address.name}">Name</h6>
                                        <p class="mb-1 small">
                                            <span th:text="${address.area}">Area</span><br>
                                            <span th:text="${address.city}">City</span>, <span
                                                th:text="${address.state}">State</span><br>
                                            <span th:text="${address.pincode}">Pincode</span>
                                        </p>
                                        <a th:href="@{/address/delete/{id}(id=${address.id})}"
                                            class="btn btn-danger btn-sm"
                                            onclick="return confirm('Delete this address?')">
                                            <i class="fas fa-trash"></i> Delete
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
