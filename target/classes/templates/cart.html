<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{base}">

<head>
    <title>Shopping Cart</title>
</head>

<body>
    <section layout:fragment="content">
        <div class="container my-5">
            <h2 class="mb-4"><i class="fas fa-shopping-cart"></i> Shopping Cart</h2>

            <div th:if="${cartItems.empty}" class="text-center py-5">
                <i class="fas fa-shopping-cart fa-4x text-muted mb-3"></i>
                <h3>Your Cart is Empty</h3>
                <p class="text-muted">Add some products to get started!</p>
                <a href="/" class="btn btn-primary">
                    <i class="fas fa-shopping-bag"></i> Continue Shopping
                </a>
            </div>

            <div th:unless="${cartItems.empty}">
                <div class="row">
                    <div class="col-md-8">
                        <div class="card mb-3" th:each="item : ${cartItems}">
                            <div class="card-body">
                                <div class="row align-items-center">
                                    <div class="col-md-2">
                                        <img th:src="${item.product.imageUrl}" class="img-fluid rounded" alt="Product">
                                    </div>
                                    <div class="col-md-4">
                                        <h5 th:text="${item.product.name}">Product Name</h5>
                                        <p class="text-muted mb-0" th:text="${item.product.category}">Category</p>
                                    </div>
                                    <div class="col-md-2">
                                        <h5 class="text-primary">₹<span th:text="${item.product.price}">999</span></h5>
                                    </div>
                                    <div class="col-md-2">
                                        <div class="input-group input-group-sm">
                                            <a th:href="@{/cart/decrease/{id}(id=${item.id})}"
                                                class="btn btn-outline-secondary">-</a>
                                            <input type="text" class="form-control text-center"
                                                th:value="${item.quantity}" readonly>
                                            <a th:href="@{/cart/increase/{id}(id=${item.id})}"
                                                class="btn btn-outline-secondary">+</a>
                                        </div>
                                    </div>
                                    <div class="col-md-2 text-end">
                                        <a th:href="@{/cart/remove/{id}(id=${item.id})}" class="btn btn-danger btn-sm">
                                            <i class="fas fa-trash"></i>
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">Order Summary</h5>
                                <hr>
                                <div class="d-flex justify-content-between mb-2">
                                    <span>Subtotal:</span>
                                    <span>₹<span th:text="${totalPrice}">0</span></span>
                                </div>
                                <div class="d-flex justify-content-between mb-2">
                                    <span>Shipping:</span>
                                    <span class="text-success">FREE</span>
                                </div>
                                <hr>
                                <div class="d-flex justify-content-between mb-3">
                                    <strong>Total:</strong>
                                    <strong class="text-primary">₹<span th:text="${totalPrice}">0</span></strong>
                                </div>
                                <a href="/checkout" class="btn btn-primary w-100 mb-2">
                                    <i class="fas fa-credit-card"></i> Proceed to Checkout
                                </a>
                                <a href="/" class="btn btn-outline-secondary w-100">
                                    <i class="fas fa-arrow-left"></i> Continue Shopping
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
