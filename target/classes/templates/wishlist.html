<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{base}">

<head>
    <title>Wishlist</title>
</head>

<body>
    <section layout:fragment="content">
        <div class="container my-5">
            <h2 class="mb-4"><i class="fas fa-heart"></i> My Wishlist</h2>

            <div th:if="${wishlistItems.empty}" class="text-center py-5">
                <i class="fas fa-heart fa-4x text-muted mb-3"></i>
                <h3>Your Wishlist is Empty</h3>
                <p class="text-muted">Add products you love to your wishlist!</p>
                <a href="/" class="btn btn-primary">
                    <i class="fas fa-shopping-bag"></i> Start Shopping
                </a>
            </div>

            <div th:unless="${wishlistItems.empty}" class="row g-4">
                <div class="col-md-3" th:each="item : ${wishlistItems}">
                    <div class="card h-100 shadow-sm">
                        <img th:src="${item.product.imageUrl}" class="card-img-top" alt="Product"
                            style="height: 250px; object-fit: cover;">
                        <div class="card-body">
                            <h5 class="card-title" th:text="${item.product.name}">Product Name</h5>
                            <p class="card-text text-muted" th:text="${item.product.category}">Category</p>
                            <h4 class="text-primary">₹<span th:text="${item.product.price}">999</span></h4>
                            <div class="d-grid gap-2">
                                <a th:href="@{/cart/add/{id}(id=${item.product.id})}" class="btn btn-primary btn-sm">
                                    <i class="fas fa-cart-plus"></i> Add to Cart
                                </a>
                                <a th:href="@{/wishlist/remove/{id}(id=${item.id})}"
                                    class="btn btn-outline-danger btn-sm">
                                    <i class="fas fa-trash"></i> Remove
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
